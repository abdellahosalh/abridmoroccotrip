<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- =============================================
       BASIC SEO META TAGS — ABRID MOROCCO
       Copy this <head> section into every page.
       Change the title & description per page.
  ================================================ -->

  <!-- Page Title (60-70 characters max) -->
  <title>Abrid Morocco | Your Path to Authentic Moroccan Adventures</title>

  <!-- Meta Description (150-160 characters max) -->
  <meta name="description" content="Abrid Morocco offers unforgettable guided tours across Morocco. Explore the Sahara Desert, imperial cities, Atlas Mountains and hidden gems of Morocco.">

  <!-- Keywords -->
  <meta name="keywords" content="Abrid Morocco, Morocco tours, Morocco travel, Sahara desert tours, Marrakech, Fez, Chefchaouen, Morocco vacation, guided tours Morocco, Morocco travel agency">

  <!-- Author -->
  <meta name="author" content="Abrid Morocco">

  <!-- Tell search engines to index this page -->
  <meta name="robots" content="index, follow">

  <!-- Language -->
  <meta http-equiv="content-language" content="en">

  <!-- Canonical URL (change per page) -->
  <link rel="canonical" href="https://www.abridmorocco.com/">

  <!-- =============================================
       OPEN GRAPH — for Facebook, WhatsApp sharing
  ================================================ -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Abrid Morocco | Your Path to Authentic Moroccan Adventures">
  <meta property="og:description" content="Explore Morocco with Abrid Morocco. Sahara desert tours, imperial cities, Atlas Mountains, and cultural experiences.">
  <meta property="og:url" content="https://www.abridmorocco.com/">
  <meta property="og:site_name" content="Abrid Morocco">
  <meta property="og:locale" content="en_US">
  <!-- Add your logo image path below -->
  <meta property="og:image" content="https://www.abridmorocco.com/images/logo-og.jpg">

  <!-- =============================================
       TWITTER CARD — for Twitter/X sharing
  ================================================ -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Abrid Morocco | Authentic Moroccan Adventures">
  <meta name="twitter:description" content="Explore Morocco with Abrid Morocco. Desert tours, imperial cities, and cultural experiences.">
  <meta name="twitter:image" content="https://www.abridmorocco.com/images/logo-og.jpg">

  <!-- =============================================
       STRUCTURED DATA (JSON-LD) — Helps Google
       understand your business
  ================================================ -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "TravelAgency",
    "name": "Abrid Morocco",
    "url": "https://www.abridmorocco.com",
    "description": "Abrid Morocco offers authentic guided tours and travel experiences across Morocco including Sahara desert trips, imperial cities, and Atlas Mountains.",
    "address": {
      "@type": "PostalAddress",
      "addressCountry": "MA",
      "addressLocality": "Morocco"
    },
    "geo": {
      "@type": "GeoCoordinates",
      "latitude": "31.7917",
      "longitude": "-7.0926"
    },
    "sameAs": [
      "https://www.facebook.com/abridmorocco",
      "https://www.instagram.com/abridmorocco",
      "https://www.tripadvisor.com/abridmorocco"
    ],
    "offers": {
      "@type": "Offer",
      "description": "Guided tours across Morocco including Sahara Desert, Marrakech, Fez, and Atlas Mountains"
    }
  }
  </script>

  <!-- =============================================
       FAVICON (your site icon in browser tab)
       Add your favicon.ico file to your root folder
  ================================================ -->
  <link rel="icon" type="image/x-icon" href="/favicon.ico">

</head>
<body>

  <!-- YOUR WEBSITE CONTENT GOES HERE -->
  <h1>Welcome to Abrid Morocco</h1>
  <p>Your Path to Authentic Moroccan Adventures</p>

</body>
</html>

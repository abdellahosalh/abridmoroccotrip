  <script>

  (function () {

    var KEY = 'abrid-popup-v1';

    var box = document.getElementById('abridPopup');

    if (!box) return;

    var seen = null;

    try { seen = localStorage.getItem(KEY); } catch (e) {}

    function open() { box.removeAttribute('hidden'); }

    function close() {

      box.setAttribute('hidden', '');

      try { localStorage.setItem(KEY, 'seen'); } catch (e) {}

    }

    if (!seen) setTimeout(function () {

      try { if (localStorage.getItem(KEY)) return; } catch (e) {}

      open();

    }, 25000);

    document.getElementById('abridPopupClose').addEventListener('click', close);

    box.addEventListener('click', function (ev) { if (ev.target === box) close(); });

    document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape' && !box.hasAttribute('hidden')) close(); });

    document.getElementById('abridPopupForm').addEventListener('submit', function (ev) {

      ev.preventDefault();

      var form = ev.target;

      var data = {

        name: document.getElementById('abridName').value,

        email: document.getElementById('abridEmail').value,

        interest: document.getElementById('abridInterest').value,

        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },

        body: JSON.stringify(data)

        document.getElementById('abridPopupBody').innerHTML =

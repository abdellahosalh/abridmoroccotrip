<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Berber Design Pack - High Contrast</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f0f12;
            --accent: #e0e0e0;
            --card-bg: #1a1a20;
            --highlight: #d4af37;
        }
        body {
            background-color: var(--bg);
            color: var(--accent);
            font-family: 'Outfit', sans-serif;
            margin: 0;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { font-weight: 600; font-size: 2.5rem; margin-bottom: 30px; }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 25px;
            width: 100%;
            max-width: 1200px;
        }
        .design-card {
            background: #ffffff; /* Show them as they will be downloaded */
            border-radius: 12px;
            padding: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 1px solid rgba(255,255,255,0.05);
            transition: 0.3s;
        }
        .svg-container {
            width: 250px;
            height: 250px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }
        svg {
            max-width: 85%;
            max-height: 85%;
            fill: none;
            stroke: #000000; /* Black ink for contrast */
            stroke-width: 8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .design-name { color: #000; opacity: 0.6; font-weight: 600; margin-bottom: 20px; text-transform: uppercase; font-size: 0.8rem; letter-spacing: 1px; }
        
        button {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: none;
            background: var(--bg);
            color: white;
            cursor: pointer;
            transition: 0.2s;
            font-weight: 600;
        }
        button:hover { background: var(--highlight); color: black; }
        canvas { display: none; }
    
@media (max-width:860px) {
    .nav-actions .contact-link,
    .nav-actions .btn-gold,
    .nav-actions .lang-wrapper,
    .nav-actions .mini-contact {
        display: none !important;
    }
}<
/* ─── FORCE ONE‑LINE HEADER ─── */
.nav {
    flex-wrap: nowrap !important;
    gap: 6px !important;
}
.nav-links {
    flex-wrap: nowrap !important;
    gap: 8px !important;
}
.nav-links a {
    font-size: 0.75rem !important;
    padding: 4px 6px !important;
    white-space: nowrap !important;
}
.nav-actions {
    flex-wrap: nowrap !important;
    gap: 4px !important;
    flex-shrink: 0 !important;
}
.nav-actions .contact-link {
    font-size: 0.75rem !important;
    padding: 4px 8px !important;
    white-space: nowrap !important;
}
.nav-actions .btn-gold {
    font-size: 0.7rem !important;
    padding: 4px 12px !important;
    white-space: nowrap !important;
}
.nav-actions .lang-selector {
    font-size: 0.65rem !important;
    padding: 3px 8px !important;
}
.brand-text strong {
    font-size: 0.9rem !important;
}
.brand-text span {
    font-size: 0.55rem !important;
}
.brand-logo {
    width: 32px !important;
    height: 32px !important;
    min-width: 32px !important;
    min-height: 32px !important;
    max-width: 32px !important;
    max-height: 32px !important;
}

/* ─── MOBILE: hide Contact & Book Now ─── */
@media (max-width: 860px) {
    .nav-actions .contact-link,
    .nav-actions .btn-gold,
    .nav-actions .lang-wrapper {
        display: none !important;
    }
    .nav-links {
        display: none !important;
    }
    .menu-toggle {
        display: flex !important;
    }
    .brand-text strong {
        font-size: 0.75rem !important;
    }
    .brand-logo {
        width: 28px !important;
        height: 28px !important;
        min-width: 28px !important;
        min-height: 28px !important;
        max-width: 28px !important;
        max-height: 28px !important;
    }
}
@media (max-width: 480px) {
    .nav-actions .lang-selector {
        display: none !important;
    }
    .brand-text strong {
        font-size: 0.65rem !important;
    }
}

<
/* ─── FIX FOOTER OVERFLOW ─── */
footer {
    overflow-x: hidden !important;
    max-width: 100% !important;
    width: 100% !important;
}
footer .container {
    max-width: 1200px !important;
    margin: 0 auto !important;
    padding: 0 16px !important;
    overflow-x: hidden !important;
}
footer .container > div {
    flex-wrap: wrap !important;
    gap: 20px !important;
}
footer .container > div > div {
    min-width: 140px !important;
    flex: 1 1 180px !important;
}
footer .container ul {
    padding: 0 !important;
    margin: 0 !important;
    list-style: none !important;
}
footer .container ul li {
    white-space: nowrap !important;
    overflow: hidden !important;
    text-overflow: ellipsis !important;
    max-width: 100% !important;
}
footer .footer-contact-btn {
    max-width: 100% !important;
    box-sizing: border-box !important;
}
footer .footer-bottom {
    flex-wrap: wrap !important;
    gap: 8px !important;
}
@media (max-width: 860px) {
    footer .container > div {
        grid-template-columns: 1fr 1fr !important;
        gap: 16px !important;
    }
    footer .container > div > div {
        flex: 1 1 100% !important;
        min-width: unset !important;
    }
    footer .container ul li {
        white-space: normal !important;
        word-break: break-word !important;
    }
}
@media (max-width: 480px) {
    footer .container {
        padding: 0 12px !important;
    }
    footer .container > div {
        grid-template-columns: 1fr !important;
        gap: 12px !important;
    }
}

</style>
</head>
<body>

    <h1 style="color:white">Berber High-Contrast Collection</h1>
    <p style="color:rgba(255,255,255,0.6); margin-bottom:40px;">These will download with a solid white background for maximum visibility.</p>

    <div class="gallery">
        <!-- FIXED YAZ -->
        <div class="design-card">
            <div class="design-name">The Yaz (ⵣ) Pro</div>
            <div class="svg-container" id="svg-yaz">
                <svg viewBox="0 0 100 100">
                    <line x1="50" y1="15" x2="50" y2="85" />
                    <path d="M50 25 C25 25 25 45 50 45 M50 55 C25 55 25 75 50 75" />
                    <path d="M50 25 C75 25 75 45 50 45 M50 55 C75 55 75 75 50 75" />
                </svg>
            </div>
            <button onclick="downloadPNG('svg-yaz', 'Berber_Yaz_Full')">Download PNG (White Background)</button>
        </div>

        <!-- HAMSA -->
        <div class="design-card">
            <div class="design-name">Geometric Hamsa</div>
            <div class="svg-container" id="svg-hamsa">
                <svg viewBox="0 0 100 100">
                    <line x1="50" y1="20" x2="50" y2="60" />
                    <line x1="35" y1="30" x2="35" y2="65" />
                    <line x1="65" y1="30" x2="65" y2="65" />
                    <circle cx="50" cy="80" r="5" fill="black" />
                    <path d="M20 50 Q20 10 50 10 Q80 10 80 50 L80 60 Q80 90 50 90 Q20 90 20 60 L20 50" />
                </svg>
            </div>
            <button onclick="downloadPNG('svg-hamsa', 'Berber_Hamsa_Full')">Download PNG (White Background)</button>
        </div>

        <!-- SNAKE -->
        <div class="design-card">
            <div class="design-name">Sacred Snake</div>
            <div class="svg-container" id="svg-snake">
                <svg viewBox="0 0 100 100">
                    <path d="M10 50 L25 30 L40 50 L55 30 L70 50 L85 30 L95 50" />
                    <circle cx="10" cy="50" r="3" fill="black"/>
                </svg>
            </div>
            <button onclick="downloadPNG('svg-snake', 'Berber_Snake_Full')">Download PNG (White Background)</button>
        </div>

        <!-- DIAMOND -->
        <div class="design-card">
            <div class="design-name">Diamond motif</div>
            <div class="svg-container" id="svg-diamond">
                <svg viewBox="0 0 100 100">
                    <rect x="25" y="25" width="50" height="50" transform="rotate(45 50 50)" />
                    <rect x="35" y="35" width="30" height="30" transform="rotate(45 50 50)" stroke-width="4"/>
                    <line x1="50" y1="45" x2="50" y2="55" stroke-width="4"/>
                    <line x1="45" y1="50" x2="55" y2="50" stroke-width="4"/>
                </svg>
            </div>
            <button onclick="downloadPNG('svg-diamond', 'Berber_Diamond_Full')">Download PNG (White Background)</button>
        </div>
    </div>

    <canvas id="canvas"></canvas>

    <script>
        function downloadPNG(containerId, filename) {
            const svg = document.getElementById(containerId).querySelector('svg');
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');
            const img = new Image();
            
            img.onload = function() {
                canvas.width = 3000;
                canvas.height = 3000;
                
                // 1. FILL SOLID WHITE BACKGROUND
                ctx.fillStyle = "white";
                ctx.fillRect(0, 0, 3000, 3000);
                
                // 2. DRAW THE DESIGN (Scaled to fit)
                ctx.drawImage(img, 300, 300, 2400, 2400); 
                
                const a = document.createElement("a");
                a.href = canvas.toDataURL("image/png", 1.0);
                a.download = `${filename}.png`;
                a.click();
            }
            const svgData = new XMLSerializer().serializeToString(svg);
            img.src = 'data:image/svg+xml;base64,' + btoa(svgData);
        }
    </script>
</body>
</html>
